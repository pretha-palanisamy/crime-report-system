<!DOCTYPE html>
<html>
<head>
    <title>Delete Crime</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f5f5f5; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; border: 1px solid #ddd; }
        .warning { color: red; font-weight: bold; }
        button { background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        a { text-decoration: none; color: #007bff; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Are you sure in deleting this crime?</h2>
        <p class="warning">You are going to delete this crime...</p>
        
        <p><b>Type:</b> {{ crime.crime_type }}</p>
        <p><b>Location:</b> {{ crime.location }}</p>
        <p><b>Description:</b> {{ crime.description }}</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'home' %}">Cancel</a>
        </form>
    </div>
</body>
</html>
