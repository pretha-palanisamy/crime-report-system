<!DOCTYPE html>
<html>
<head>
    <title>Edit Crime - {{ crime.crime_type }}</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f4f4f4; }
        .form-container { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; }
        input, textarea, select { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #3498db; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2980b9; }
        a { text-decoration: none; color: #555; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Edit Crime: {{ crime.crime_type }}</h2>
        <p><strong>Location:</strong> {{ crime.location }}</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Update Crime</button>
            <a href="{% url 'home' %}" style="margin-left:10px;">Cancel</a>
        </form>
    </div>
</body>
</html>
