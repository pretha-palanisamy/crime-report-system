<!DOCTYPE html>
<html>
<head>
    <title>Crime Management System</title>
    <style>
        body { font-family: Arial; background: #f4f6f9; margin: 0; }
        .navbar { background: #007bff; padding: 15px; display: flex; justify-content: space-between; }
        .navbar a { color: white; text-decoration: none; padding: 10px 15px; font-weight: bold; }
        .navbar a:hover { background: #0056b3; border-radius: 5px; }
        .container { max-width: 900px; margin: 20px auto; background: white; padding: 25px; border-radius: 10px; }
        form label { display: block; margin: 10px 0 5px; font-weight: bold; }
        form input, form select, form textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        form button { margin-top: 15px; padding: 12px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .report-card { border-left: 5px solid #007bff; padding: 15px; margin-bottom: 15px; background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="navbar">
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'report_crime' %}">Report New Crime</a>
            <a href="/admin/">Admin Panel</a>
        </div>
        <div>
            <span style="color:white;">Hi, {{ user.username }}</span>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
