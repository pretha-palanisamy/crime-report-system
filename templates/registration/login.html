<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f5f5f5; }
        .login-box { background: white; border: 1px solid #ccc; padding: 30px; border-radius: 8px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="'login-box">
        <h2>Crime Report System</h2>
        <form method="post"
           {% csrf_token %}
           {{form.as_p}}
           <button type="submit">Login</button>
    </form>
    </div>
</body>
</html>
